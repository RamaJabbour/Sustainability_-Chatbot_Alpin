<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #C0C0C0;
            color: black;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #loginContainer, #chatContainer {
            background-color: #C0C0C0;
            display: none;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: auto;
            padding: 20px;
        }
        #loginBox, #chatBox {
            background: #C0C0C0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: none;
            color: black;
        }
        #loginBox {
            margin-top: 10px;
            padding-top: 10px;
        }
        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: #C0C0C0; /* Match the background color */
            border-radius: 5px;
            margin-bottom: 10px;
            max-height: 300px;
            border: none; /* Remove the border */
        }
        #messageInput {
            display: flex;
            align-items: center; /* Align the icon and input vertically */
            margin-top: 10px;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            width: fit-content;
            max-width: 70%;
            word-wrap: break-word;
            color: black; /* Set text color to black */
        }
        .message.user {
            background-color: #D3D3D3; /* Light ash color for user message */
            align-self: flex-end;
            color: black;
            text-align: right;
        }
        .message.bot {
            background-color: #C0C0C0; /* Match bot message background to overall background */
            align-self: flex-start;
            color: black;
            text-align: left;
        }
        #logoutButton {
            color: black;
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #C0C0C0;
            border-radius: 30px; /* Rounded edges for the logout button */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1); /* Dark grey shadow */
        }

        #logoutButton:active, #logoutButton:focus {
            background-color: red;
        }

        #chatContainer h1 {
            color: #ffffff;
            text-shadow: 2px 2px #064635;
            margin-bottom: 50px;
        }

        #loginBox .form-control, #loginButton {
            width: 95%;
            margin-left: auto;
            margin-right: auto;
            padding: 8px;
            font-size: 14px;
            background-color: white;
            color: black;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1); /* Dark grey shadow */
            border-radius: 10px; /* Rounded edges */
        }

        #loginButton {
            width: 95%;
            margin-left: auto;
            margin-right: auto;
            padding: 8px;
            font-size: 14px;
            background-color: white;
            color: black;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, ); /* Dark grey shadow */
            border-radius: 10px; /* Rounded edges */
            transition: background-color 0.3s ease;
        }

        #loginButton:active, #loginButton:focus {
            background-color: black;
            color: white;
        }

        .input-group {
            position: relative; /* Ensures the eye icon is positioned inside the input field */
        }

        .input-group .eye-icon {
            position: absolute;
            right: 10px; /* Adjust this value based on padding */
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .send-icon {
            cursor: pointer;
            padding-left: 10px; /* Adjust the padding between the icon and input */
        }

        #messageText {
            width: 95%; /* Adjust width to fit with send icon */
            height: 40px; /* Height adjustment */
            resize: none;
            border-radius: 10px; /* Rounded edges for the input */
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1); /* Dark grey shadow */
        }

        #sendIcon {
            width: 24px;  /* Smaller size for the send icon */
            height: 24px;
            cursor: pointer;  /* Makes the icon behave like a clickable button */
            transition: transform 0.2s ease, box-shadow 0.2s ease; /* Add transition for box-shadow */
        }

        #sendIcon:hover {
            transform: scale(1.1);  /* Slight zoom effect when hovering */
        }

        /* Add shine effect when active */
        #sendIcon:active {
            box-shadow: 0 0 15px white; /* White glow effect when pressed */
        }

        #eyeIcon {
            width: 20px;  /* Smaller size for the eye icon */
            height: 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #eyeIcon:hover {
            transform: scale(1.1);  /* Slight zoom effect when hovering */
        }
    </style>
</head>
<body>

<div id="loginBox">
    <!-- Removed the logo section -->
    <!-- Login Form -->
    <form id="loginForm" onsubmit="return validateLogin();">
        <div class="form-group mt-4">
            <input type="text" id="usernameInput" class="form-control" placeholder="Username">
        </div>
        <div class="form-group input-group">
            <input type="password" id="passwordInput" class="form-control" placeholder="Password">
            <span class="eye-icon" onclick="togglePasswordVisibility()">
                <img src="https://img.icons8.com/ios-filled/20/000000/visible.png" id="eyeIcon" alt="Toggle Visibility">
            </span>
        </div>
        <button id="loginButton" class="btn btn-secondary btn-block" type="submit">Login</button>
    </form>
</div>

<div id="chatContainer" class="container text-center">
    <div id="chatBox">
    
        <button id="logoutButton" class="btn btn-danger" onclick="logout()">Logout</button>
        <div id="messages"></div>
        <!-- Send input and button -->
        <div id="messageInput">
            <textarea id="messageText" class="form-control" placeholder="Enter your question here..." aria-label="Message"></textarea>
            <span class="send-icon" onclick="sendMessage()" id="sendIconWrapper">
                <img src="https://img.icons8.com/ios-glyphs/30/000000/paper-plane.png" alt="Send" id="sendIcon">
            </span>
        </div>
    </div>
</div>

<script>
    let isLoggedIn = false;

    const ws = new WebSocket("ws://localhost:8001/ws");

    ws.onopen = function(event) {
        console.log("WebSocket connection established");
    };

    ws.onmessage = function(event) {
        const messages = document.getElementById('messages');
        const message = document.createElement('pre');
        message.textContent = event.data;
        message.classList.add('message', 'bot');
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
    };

    ws.onclose = function(event) {
        console.log("WebSocket connection closed");
    };

    ws.onerror = function(event) {
        console.error("WebSocket error observed:", event);
    };

    function sendMessage() {
        if (!isLoggedIn) {
            alert("Please log in to send a message.");
            return;
        }

        const input = document.getElementById("messageText");
        if (input.value.trim() === "") {
            return;
        }

        const message = document.createElement('div');
        message.textContent = input.value;
        message.classList.add('message', 'user');
        const messages = document.getElementById('messages');
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
        ws.send(input.value);
        input.value = '';
    }

    document.getElementById('passwordInput').addEventListener('input', function() {
        const eyeIcon = document.querySelector('.eye-icon');
        if (this.value.length > 0) {
            eyeIcon.style.display = 'block';
        }
    });

  document.getElementById("messageText").addEventListener("keypress", function(event) {     
     if (event.key === "Enter" && !event.shiftKey) {  // Only Enter without Shift sends the message                                    event.preventDefault();  // Prevent adding a new line 
          sendMessage(); // Send the message 
      }
});

    function validateLogin() {
        const username = document.getElementById("usernameInput").value;
        const password = document.getElementById("passwordInput").value;

        console.log("Attempting to log in with username:", username);

        fetch('http://localhost:8001/validate_login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password }),
        })
        .then(response => {
            console.log("Received response status:", response.status);
            if (response.ok) {
                return response.json();
            } else {
                return response.json().then(err => { throw err; });
            }
        })
        .then(data => {
            console.log("Received response data:", data);
            if (data.success) {
                isLoggedIn = true;
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
                alert(data.message);
            }
        })
        .catch((error) => {
            console.error("Login error:", error);
            alert(error.detail || "Incorrect username or password. Please try again.");
        });

        return false;
    }

    function logout() {
        const confirmation = confirm("Are you sure you want to logout?");
        
        if (confirmation) {
            isLoggedIn = false;
            document.getElementById('usernameInput').value = ''; 
            document.getElementById('passwordInput').value = ''; 
            document.getElementById('loginBox').style.display = 'flex';
            document.getElementById('chatContainer').style.display = 'none';
            window.scrollTo(0, 0);
            alert("You have been logged out.");
        } else {
            return;
        }
    }

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.src = 'https://img.icons8.com/ios-filled/20/000000/invisible.png'; 
        } else {
            passwordInput.type = 'password';
            eyeIcon.src = 'https://img.icons8.com/ios-filled/20/000000/visible.png'; 
        }
    }

</script>

</body>
</html>
